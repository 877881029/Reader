[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reader"
version = "0.1.0"
description = "Windows desktop viewer for docx, pptx, xlsx, and markdown"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "markdown-it-py>=3.0",
    "pywin32>=306",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "pytest-mock>=3.14",
    "Pillow>=10.0",
    "PyInstaller>=6.15",
]

[project.scripts]
reader = "reader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "office: requires Microsoft Office COM",
]
