[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reader"
dynamic = ["version"]
description = "Windows multi-format document viewer"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.11.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "openpyxl==3.1.5",
    "markdown-it-py==4.2.0",
    "pywin32==312",
    "pywinpty==3.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "pytest-mock==3.15.1",
    "Pillow==12.3.0",
    "PyInstaller==6.22.3",
]

[project.scripts]
reader = "reader.launcher:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "office: requires Microsoft Office COM",
    "webengine: requires Qt WebEngine process and committed viewer bundle",
]
